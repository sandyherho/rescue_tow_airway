[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rescue_tow_airway"
version = "0.1.0"
description = "Airway submersion of an unconscious scuba diver during a surface tow in idealized random seas"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Sandy H. S. Herho", email = "sandyherho@itb.ac.id" },
    { name = "Raden Dwi Susanto", email = "dwisusa@umd.edu" },
    { name = "Sito F. Biosa" },
    { name = "Rusmawan Suwarman" },
    { name = "Dasapta E. Irawan" },
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7",
                "pillow>=9"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
]

[tool.setuptools]
packages = ["rescue_tow_airway"]
